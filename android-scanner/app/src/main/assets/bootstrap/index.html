<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>POSNext Scanner — настройка API</title>
		<style>
			:root {
				color-scheme: dark;
				--bg: #0b1220;
				--fg: #e8eef9;
				--muted: #93a0b8;
				--accent: #5eead4;
				--danger: #fb7185;
				font-family: "Segoe UI", system-ui, sans-serif;
			}
			body {
				margin: 0;
				min-height: 100vh;
				background: radial-gradient(900px 420px at 50% -10%, #1a2744, var(--bg));
				color: var(--fg);
				padding: 1.25rem;
			}
			h1 {
				font-size: 1.35rem;
				margin: 0 0 0.5rem;
			}
			p {
				color: var(--muted);
				line-height: 1.45;
			}
			label {
				display: grid;
				gap: 0.35rem;
				margin: 0.85rem 0;
				font-size: 0.85rem;
				color: var(--muted);
			}
			input {
				font: inherit;
				padding: 0.75rem 0.85rem;
				border-radius: 10px;
				border: 1px solid rgba(148, 163, 184, 0.35);
				background: #0a1020;
				color: var(--fg);
			}
			button {
				margin-top: 1rem;
				width: 100%;
				border: 0;
				border-radius: 12px;
				padding: 0.9rem 1rem;
				font-weight: 700;
				background: var(--accent);
				color: #04201b;
			}
			.err {
				color: var(--danger);
			}
			.status {
				color: var(--accent);
				font-size: 0.9rem;
			}
			.mono {
				font-family: ui-monospace, monospace;
				font-size: 0.8rem;
				word-break: break-all;
				color: var(--accent);
			}
		</style>
	</head>
	<body>
		<h1>POSNext Scanner</h1>
		<p>
			Интерфейс сканера, OCR и WASM уже внутри APK. Укажите HTTPS-сайт ERPNext/POSNext
			<strong>только для API</strong> (pairing / корзина). Хостинг
			<code>/pos-scanner</code> на сервере не нужен — UI не загружается с сайта.
		</p>
		<label>
			URL сервера API
			<input id="serverUrl" type="url" placeholder="https://pos.example.com" autocomplete="url" />
		</label>
		<p id="preview" class="mono"></p>
		<p id="error" class="err" hidden></p>
		<p id="status" class="status" hidden></p>
		<button type="button" id="go">Сохранить и открыть сканер</button>
		<script>
			function normalizeOrigin(raw) {
				var t = (raw || "").trim().replace(/\/+$/, "");
				if (!t) return "";
				if (!/^https?:\/\//i.test(t)) t = "https://" + t;
				try {
					var u = new URL(t);
					if (u.protocol !== "https:" && u.protocol !== "http:") return "";
					if (u.hostname === "appassets.androidplatform.net") return "";
					return u.protocol + "//" + u.host;
				} catch (e) {
					return "";
				}
			}
			function refreshPreview() {
				var o = normalizeOrigin(document.getElementById("serverUrl").value);
				document.getElementById("preview").textContent = o ? "API: " + o : "";
			}
			document.getElementById("serverUrl").addEventListener("input", refreshPreview);
			try {
				if (window.PosNextShell && window.PosNextShell.getServerConfigJson) {
					var cfg = JSON.parse(window.PosNextShell.getServerConfigJson() || "{}");
					if (cfg.serverUrl) document.getElementById("serverUrl").value = cfg.serverUrl;
				}
			} catch (e) {}
			refreshPreview();
			document.getElementById("go").addEventListener("click", function () {
				var err = document.getElementById("error");
				var status = document.getElementById("status");
				err.hidden = true;
				var origin = normalizeOrigin(document.getElementById("serverUrl").value);
				if (!origin) {
					err.textContent = "Укажите корректный URL API (https://…)";
					err.hidden = false;
					return;
				}
				if (!(window.PosNextShell && window.PosNextShell.applyServerConfig)) {
					err.textContent = "Мост приложения недоступен. Переустановите APK.";
					err.hidden = false;
					return;
				}
				status.hidden = false;
				status.textContent = "Сохраняем API URL…";
				try {
					// Empty path: offline shell ignores PWA path entirely.
					window.PosNextShell.applyServerConfig(origin, "");
				} catch (e) {
					err.textContent = "Ошибка: " + (e && e.message ? e.message : e);
					err.hidden = false;
					status.hidden = true;
				}
			});
		</script>
	</body>
</html>
